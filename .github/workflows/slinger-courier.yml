name: Slinger transfer courier

on:
  pull_request:
    paths:
      - "slinger-transfer.md"

permissions:
  contents: read

jobs:
  courier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact OpenArt clips
        run: python slinger_courier.py
      - name: Upload clips
        uses: actions/upload-artifact@v4
        with:
          name: slinger-openart-exact
          path: slinger-openart/
          retention-days: 1
